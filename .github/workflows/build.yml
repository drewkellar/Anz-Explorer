name: build

on:
  push:
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AnzExplorer.sln -p:Platform=x64
      - name: Build
        run: dotnet build AnzExplorer.sln -c Release -p:Platform=x64 --no-restore
      - name: Test
        run: dotnet test tests/AnzExplorer.Core.Tests/AnzExplorer.Core.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore
